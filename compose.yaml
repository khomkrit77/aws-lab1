services:
  maze-munch:
    build: .
    ports:
      - "${APP_PORT:-8083}:8000"
    environment:
      DB_PATH: /data/maze-munch.sqlite3
      PORT: "8000"
    volumes:
      - maze_munch_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  maze_munch_data:
